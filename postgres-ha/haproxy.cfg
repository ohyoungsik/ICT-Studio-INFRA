# ---------------------------------------------------------------------------
# HAProxy for PostgreSQL Primary Routing
# ---------------------------------------------------------------------------
# 목적:
# - 애플리케이션은 haproxy:5432로만 접속한다.
# - HAProxy는 primary, replica1, replica2 중 현재 Primary만 backend로 사용한다.
# - 단순 TCP 접속 확인은 standby도 정상으로 판단하므로 사용하지 않는다.
# - PostgreSQL wire protocol로 SELECT NOT pg_is_in_recovery()를 실행해 true를 반환하는 노드만 살린다.
#
# 주의:
# - 이 health check는 PostgreSQL pg_hba가 내부 overlay network에서 trust를 허용해야 동작한다.
# - 운영에서는 별도 role-check endpoint, TLS, 방화벽, Secret 기반 인증으로 보완하는 것이 좋다.
# ---------------------------------------------------------------------------

global
    # stdout 로그는 docker service logs에서 바로 확인할 수 있다.
    log stdout format raw local0

    # show stat 명령을 TCP로 받을 admin socket이다.
    # README 예시:
    #   echo "show stat" | socat stdio tcp4-connect:localhost:8404
    stats socket ipv4@*:8404 level admin

    # HAProxy 프로세스는 컨테이너 foreground로 실행되어야 Swarm이 상태를 추적할 수 있다.
    master-worker

defaults
    # PostgreSQL은 TCP 프로토콜이므로 HTTP mode를 사용하지 않는다.
    mode tcp
    log global
    option tcplog

    # 장애 감지를 빠르게 하되, 일시적인 네트워크 지연으로 잦은 flap이 생기지 않도록 timeout을 둔다.
    timeout connect 5s
    timeout client  1m
    timeout server  1m
    timeout check   5s

    # Swarm DNS는 127.0.0.11에서 제공된다.
    # 서비스 재시작으로 backend IP가 바뀌어도 HAProxy가 다시 해석할 수 있게 한다.
    default-server init-addr libc,none resolvers docker resolve-prefer ipv4

resolvers docker
    # Docker embedded DNS이다.
    nameserver dns 127.0.0.11:53
    resolve_retries       3
    timeout retry         1s
    hold valid            10s

frontend postgres_write
    # 애플리케이션은 이 포트로만 접속한다.
    # Swarm 내부에서는 haproxy:5432, 외부에서는 advancedproject:5432를 사용한다.
    bind *:5432
    default_backend postgres_primary

backend postgres_primary
    # standby도 TCP 접속은 가능하므로 SQL 기반 check를 사용한다.
    # 아래 바이너리는 PostgreSQL startup packet으로 user=repmgr, database=repmgr 접속을 시작한다.
    option tcp-check
    tcp-check connect
    tcp-check send-binary 000000440003000075736572007265706d6772006461746162617365007265706d6772006170706c69636174696f6e5f6e616d6500686170726f78795f636865636b0000

    # trust 인증일 때 PostgreSQL은 AuthenticationOk 메시지를 보낸다.
    # 인증 실패 또는 접속 거부이면 이 단계에서 backend를 down 처리한다.
    tcp-check expect binary 520000000800000000

    # startup 완료 후 ReadyForQuery 메시지가 와야 SQL 질의를 보낼 수 있다.
    tcp-check expect binary 5a0000000549

    # 현재 노드가 Primary인지 확인한다.
    # SELECT NOT pg_is_in_recovery(); 결과가 true이면 Primary, false이면 standby이다.
    tcp-check send-binary 510000002453454c454354204e4f542070675f69735f696e5f7265636f7665727928293b00

    # DataRow 1개 컬럼의 값이 't'이면 현재 Primary이다.
    # standby는 같은 위치에 'f'를 반환하므로 health check가 실패한다.
    tcp-check expect binary 440000000b00010000000174

    # health check 통과 노드만 실제 backend로 사용한다.
    # replica1은 우선 승격 후보이지만, 승격 전에는 pg_is_in_recovery()가 true라서 backend에서 제외된다.
    server primary  primary:5432  check inter 2s fall 3 rise 2
    server replica1 replica1:5432 check inter 2s fall 3 rise 2
    server replica2 replica2:5432 check inter 2s fall 3 rise 2

listen stats_page
    # 브라우저로 확인하는 HAProxy 통계 페이지이다.
    # 운영에서는 인증, 사설망 제한, TLS를 적용해야 한다.
    mode http
    bind *:8405
    stats enable
    stats uri /
    stats refresh 5s

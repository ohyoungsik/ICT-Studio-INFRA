name: Terraform Deploy

on:
  workflow_dispatch:
    inputs:
      backend_key:
        description: 'Terraform backend state key.'
        required: true
        default: 'prod-ict/terraform.tfstate'
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ap-northeast-2
      TF_BACKEND_KEY: ${{ inputs.backend_key }}
      TF_INPUT: "false"
      TF_VAR_telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TF_VAR_telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
      TF_VAR_discord_webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init backend
        run: bash scripts/init-backend-ci.sh

      - name: Terraform validate
        run: terraform -chdir=terraform_files validate

      - name: Terraform plan
        run: terraform -chdir=terraform_files plan -out=tfplan

      - name: Terraform apply
        run: terraform -chdir=terraform_files apply -auto-approve tfplan

      - name: Start ASG instance refresh
        run: |
          ASG_NAME=$(terraform -chdir=terraform_files output -raw asg_name)
          aws autoscaling start-instance-refresh --auto-scaling-group-name "$ASG_NAME" --strategy Rolling --preferences '{"MinHealthyPercentage":50,"InstanceWarmup":300}'

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Download SSH private key for Ansible
        run: |
          KEY_NAME=$(terraform -chdir=terraform_files output -raw key_pair_name)
          SECRET_NAME=$(terraform -chdir=terraform_files output -raw private_key_secret_name)

          aws secretsmanager get-secret-value --secret-id "$SECRET_NAME" --query SecretString --output text > "terraform_files/${KEY_NAME}.pem"

          chmod 600 "terraform_files/${KEY_NAME}.pem"

      - name: Show Ansible inventory
        working-directory: ansible_files
        run: ansible-inventory --list

      - name: Wait for PostgreSQL HA SSH
        working-directory: ansible_files
        run: ansible postgres_ha -m wait_for_connection -a "timeout=300 sleep=5"

      - name: Run Ansible deploy
        working-directory: ansible_files
        run: ansible-playbook playbooks/deploy.yml

      - name: Run Ansible verify
        working-directory: ansible_files
        run: ansible-playbook playbooks/verify.yml

name: Terraform

on:
  push:
    branches:
      - main
    paths:
      - "terraform_files/**"
      - "ansible_files/**"
      - "postgres-ha/**"
      - "scripts/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    paths:
      - "terraform_files/**"
      - "ansible_files/**"
      - "postgres-ha/**"
      - "scripts/**"
      - ".github/workflows/terraform.yml"

jobs:
  terraform:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ap-northeast-2
      TF_BACKEND_KEY: prod-ict/terraform.tfstate
      TF_INPUT: "false"
      TF_VAR_telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TF_VAR_telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
      TF_VAR_discord_webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init backend
        run: bash scripts/init-backend-ci.sh

      - name: Terraform validate
        run: terraform -chdir=terraform_files validate

      - name: Terraform plan
        run: terraform -chdir=terraform_files plan -out=tfplan

      - name: Terraform apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform -chdir=terraform_files apply -auto-approve tfplan

      - name: Install Ansible
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Download SSH private key for Ansible
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          KEY_NAME=$(terraform -chdir=terraform_files output -raw key_pair_name)
          SECRET_NAME=$(terraform -chdir=terraform_files output -raw private_key_secret_name)

          aws secretsmanager get-secret-value --secret-id "$SECRET_NAME" --query SecretString --output text > "terraform_files/${KEY_NAME}.pem"

          chmod 600 "terraform_files/${KEY_NAME}.pem"

      - name: Show Ansible inventory
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ansible_files
        run: ansible-inventory --list

      - name: Wait for Bastion SSH
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ansible_files
        run: ansible monitoring_server -m wait_for_connection -a "timeout=300 sleep=5"

      - name: Wait for PostgreSQL HA SSH
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ansible_files
        run: ansible postgres_ha -m wait_for_connection -a "timeout=600 sleep=5"

      - name: Run Ansible deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ansible_files
        run: ansible-playbook playbooks/deploy.yml

      - name: Run Ansible verify
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ansible_files
        run: ansible-playbook playbooks/verify.yml

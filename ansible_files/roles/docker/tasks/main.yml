---
# 기존 user-data가 docker.gpg signed-by로 Docker repo를 등록했을 수 있어 충돌 원인을 먼저 제거한다.
- name: Remove legacy Docker apt source created by user-data
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

# Docker 공식 apt repository key를 저장할 디렉터리를 준비한다.
- name: Ensure Docker apt key directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

# Docker Engine을 Docker 공식 repo에서 설치하기 위한 GPG key이다.
# 모든 노드에서 docker.asc 하나로 통일해 Signed-By 충돌을 방지한다.
- name: Install Docker official apt key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

# Ubuntu release codename에 맞는 Docker stable repository를 추가한다.
- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

# Swarm stack 배포에 필요한 Docker Engine과 Compose plugin을 설치한다.
- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

# 재부팅 후에도 Docker가 자동 시작되도록 설정한다.
- name: Enable Docker service
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

# 운영자가 ubuntu 계정으로 Docker 명령을 실행할 수 있게 한다.
- name: Add ubuntu user to docker group
  ansible.builtin.user:
    name: ubuntu
    groups: docker
    append: true

# 모니터링 대상에 포함시키기 위해 모든 PostgreSQL HA 노드에서 node-exporter를 실행한다.
# Docker 설치와 서비스 시작이 끝난 뒤 실행해야 하므로 docker role의 마지막 단계에 둔다.
- name: Check existing node-exporter container
  ansible.builtin.command: docker ps -a --format '{{ "{{.Names}}" }}'
  register: node_exporter_containers
  changed_when: false

# node-exporter가 아직 없는 노드에서만 컨테이너를 생성해 playbook 재실행 시 이름 충돌을 피한다.
# db-main-userdata.sh에 있던 설정과 동일하게 호스트 CPU, 메모리, 디스크 메트릭을 9100 포트에 노출한다.
- name: Run node-exporter container
  ansible.builtin.command:
    argv:
      - docker
      - run
      - -d
      - --name
      - node-exporter
      - --restart
      - always
      - --pid=host
      - -p
      - 9100:9100
      - -v
      - /proc:/host/proc:ro
      - -v
      - /sys:/host/sys:ro
      - -v
      - /:/rootfs:ro
      - prom/node-exporter:v1.11.1
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)
  when: "'node-exporter' not in node_exporter_containers.stdout_lines"


---
# EC2 user-data가 끝나기 전에 Ansible이 apt 작업을 시작하는 상황을 피한다.
- name: Wait for cloud-init to finish
  ansible.builtin.command: cloud-init status --wait
  changed_when: false
  failed_when: false

# 모든 DB 노드의 timezone을 운영 기준으로 통일한다.
- name: Set timezone
  ansible.builtin.command: "timedatectl set-timezone {{ timezone | default('Asia/Seoul') }}"
  changed_when: false
  when: ansible_facts.os_family == "Debian"


# 기존 user-data가 Docker repo를 다른 signed-by 값으로 등록했을 수 있어 apt update 전에 정리한다.
- name: Remove legacy Docker apt source before apt update
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

# Docker 설치 전 apt metadata를 갱신한다.
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

# Docker 설치와 파일 동기화, HAProxy stats 확인에 필요한 기본 도구를 설치한다.
- name: Install common packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - python3-pip
      - rsync
      - socat
    state: present
